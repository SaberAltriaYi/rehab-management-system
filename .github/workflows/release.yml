name: Build signed LAN release

on:
  push:
    tags:
      - "rehab-lan-v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: yudao-ui/yudao-ui-admin-vue3-app/pnpm-lock.yaml
      - name: Build frontend
        working-directory: yudao-ui/yudao-ui-admin-vue3-app
        run: |
          pnpm install --frozen-lockfile
          pnpm build:internal
          pnpm audit:prod
      - name: Build backend
        run: deploy/internal/build-server-isolated.sh
      - name: Test bootstrap password tool
        run: >-
          mvn -B -pl yudao-server -am
          -Dtest=PasswordHashCliTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Build release bundle
        run: script/rehab/build-lan-release.sh "$GITHUB_REF_NAME"
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Sign release bundle
        run: |
          bundle=$(find deploy/lan/release-output -maxdepth 1 -name '*.tar.gz' -print -quit)
          cosign sign-blob --yes \
            --bundle "${bundle}.sigstore.json" \
            "$bundle"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flag=
          case "$GITHUB_REF_NAME" in
            *-rc*|*-beta*) release_flag=--prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            deploy/lan/release-output/* \
            --verify-tag \
            --generate-notes \
            $release_flag \
            --title "康复管理系统局域网版 ${GITHUB_REF_NAME}"
