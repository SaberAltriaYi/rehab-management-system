name: SaaS DEV container packages
on:
  push:
    branches: ['integration/saas']
    paths: ['.github/workflows/saas-ghcr-dev.yml', 'deploy/saas/Dockerfile.server']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: yudao-ui/yudao-ui-admin-vue3-app/pnpm-lock.yaml
      - name: Full selected SaaS backend tests
        run: mvn -B -Prehab-business-integration -pl yudao-server -am test
      - name: Build isolated backend including explicitly selected business modules
        run: deploy/internal/build-server-isolated.sh --business
      - name: Fresh frontend build, type gate and production audit
        working-directory: yudao-ui/yudao-ui-admin-vue3-app
        run: |
          pnpm install --frozen-lockfile
          pnpm build:internal
          pnpm ts:check
          pnpm audit:prod
      - name: Check source materials
        run: script/rehab/check-repository-sensitive-materials.sh
      - name: Bind build inputs to source and checksums
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          jar=Path('yudao-server/target/yudao-server.jar')
          files=[jar,*sorted(p for p in Path('yudao-ui/yudao-ui-admin-vue3-app/dist-internal').rglob('*') if p.is_file())]
          assert jar.is_file() and len(files)>1
          Path('container-inputs.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-container-inputs-${{ github.sha }}
          path: |
            yudao-server/target/yudao-server.jar
            yudao-ui/yudao-ui-admin-vue3-app/dist-internal/
            desktop/build/frontend-build-receipt.json
            container-inputs.json
          if-no-files-found: error
          retention-days: 7
  native-images:
    needs: verified-inputs
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@v5
        with:
          name: verified-container-inputs-${{ github.sha }}
      - name: Verify exact source and package inputs
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          data=json.loads(Path('container-inputs.json').read_text())
          assert data['source_commit']==os.environ['GITHUB_SHA']
          for name,digest in data['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Build native development images
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SERVER="ghcr.io/saberaltriayi/rehab-saas-server-dev:dev-${GITHUB_SHA}-${ARCH}"
          ADMIN="ghcr.io/saberaltriayi/rehab-saas-admin-dev:dev-${GITHUB_SHA}-${ARCH}"
          docker build -f deploy/saas/Dockerfile.server --label "org.opencontainers.image.source=https://github.com/SaberAltriaYi/rehab-management-system" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$SERVER" .
          docker build -f deploy/internal/Dockerfile.admin --label "org.opencontainers.image.source=https://github.com/SaberAltriaYi/rehab-management-system" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$ADMIN" .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint java "$SERVER" -version
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint nginx "$ADMIN" -v
      - name: Publish only verified development images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for SERVICE in server admin; do
            docker push "ghcr.io/saberaltriayi/rehab-saas-${SERVICE}-dev:dev-${GITHUB_SHA}-${ARCH}"
          done
  multiarch:
    needs: native-images
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Publish version-matched multiarch indexes
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for SERVICE in server admin; do
            IMAGE="ghcr.io/saberaltriayi/rehab-saas-${SERVICE}-dev:dev-${GITHUB_SHA}"
            docker manifest create "$IMAGE" "${IMAGE}-amd64" "${IMAGE}-arm64"
            docker manifest push "$IMAGE"
          done
