name: Internal release CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - feature/reporter-engine-assessment-20261013

permissions:
  contents: read

concurrency:
  # Push + an existing PR otherwise run the same full suite twice. Include
  # source repository so a fork cannot cancel the main repository's checks.
  group: internal-release-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Keep Maven timestamp tests consistent with the Asia/Shanghai production runtime.
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test password bootstrap
        run: >-
          mvn -B -pl yudao-server -am
          -Dtest=PasswordHashCliTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Test rehabilitation and shared backend modules
        run: mvn -B -pl yudao-module-rehab -am test
      - name: Build production server
        run: deploy/internal/build-server-isolated.sh

  business-integration:
    runs-on: ubuntu-latest
    env:
      # Keep Maven timestamp tests consistent with the Asia/Shanghai production runtime.
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # This is a build/test gate only. The internal production release still
      # uses the default profile above and must not package these modules.
      - name: Test optional institution modules and dependencies
        run: mvn -B -Prehab-business-integration -pl yudao-server -am test
      - name: Package optional modules in the CI-only job
        run: mvn -B -Prehab-business-integration -pl yudao-server -am -DskipTests package

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yudao-ui/yudao-ui-admin-vue3-app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: yudao-ui/yudao-ui-admin-vue3-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Vite generates ignored auto-imports/components declarations. A clean
      # checkout must build once before vue-tsc can see these global types.
      - run: pnpm build:internal
      # Build success alone does not establish type safety. Fail closed until
      # the existing diagnostics are repaired; do not mask this with || true.
      - run: pnpm ts:check
      - run: pnpm audit:prod

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yudao-ui/yudao-ui-rehab-uniapp
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: yudao-ui/yudao-ui-rehab-uniapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - run: pnpm type-check
      # These are code builds, not approved/signed apps or a WeChat release.
      - run: pnpm build:h5
      - run: pnpm build:mp-weixin
      - run: pnpm build:app

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check repository for sensitive materials
        run: script/rehab/check-repository-sensitive-materials.sh
      - name: Validate POSIX scripts
        run: |
          find deploy script -type f -name '*.sh' -print0 |
            while IFS= read -r -d '' file; do
              case "$(head -n 1 "$file")" in
                *bash*) bash -n "$file" ;;
                *sh*) sh -n "$file" ;;
                *) echo "Unsupported shell shebang: $file" >&2; exit 1 ;;
              esac
            done
          sh -n install.sh
          sh -n rehabctl.sh
      - name: Test migration safety guards
        run: python3 -m unittest discover -s deploy/internal -p 'test_migration_guard.py' -v
      - name: Test synthetic database cleanup ownership and secret boundaries (no Docker)
        run: python3 -B -m unittest discover -s deploy/internal -p 'test_synthetic_mysql.py' -v
      - name: Verify patient source migration on isolated MySQL (synthetic fixtures only)
        env:
          REHAB_TEST_MYSQL: '1'
        run: python3 -B -m unittest discover -s deploy/internal -p 'test_patient_data_origin_mysql.py' -v
      - name: Verify report version locks on MySQL REPEATABLE READ (synthetic fixtures only)
        env:
          REHAB_TEST_MYSQL: '1'
        run: python3 -B -m unittest discover -s deploy/internal -p 'test_report_version_mysql.py' -v
      - name: Verify report request ledger and current reads on isolated MySQL
        env:
          REHAB_TEST_MYSQL: '1'
        run: python3 -B -m unittest discover -s deploy/internal -p 'test_report_requests_mysql.py' -v
      - name: Test S0 inventory and secret finding boundaries with synthetic inputs
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ required"'
          python3 -B -m unittest discover -s script/rehab -p 'test_s0_inventory.py' -v
      - name: Verify migration checksums
        run: deploy/internal/migrate.sh verify-files
      - name: Validate Compose configuration
        run: |
          cp deploy/internal/.env.example deploy/internal/.env
          docker compose --env-file deploy/internal/.env \
            -f deploy/internal/docker-compose.yml config --quiet

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $files = @(
            "install.ps1",
            "rehabctl.ps1",
            "deploy/lan/install.ps1",
            "deploy/lan/rehabctl.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
