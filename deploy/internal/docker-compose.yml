name: ${COMPOSE_PROJECT_NAME:-rehab-internal}

services:
  mysql:
    image: mysql:8.4.10
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_DATABASE: ${DB_NAME:-ruoyi-vue-pro}
      MYSQL_USER: ${DB_USERNAME:-yudao}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/01-base.sql:ro
      - ../../sql/mysql/quartz.sql:/docker-entrypoint-initdb.d/05-quartz.sql:ro
      - ../../sql/mysql/rehab-init-v1.sql:/docker-entrypoint-initdb.d/10-rehab-init.sql:ro
      - ../../sql/mysql/rehab-step2-v1.sql:/docker-entrypoint-initdb.d/20-rehab-step2.sql:ro
      - ../../sql/mysql/rehab-step3-v1.sql:/docker-entrypoint-initdb.d/30-rehab-step3.sql:ro
      - ../../sql/mysql/rehab-step4-v1.sql:/docker-entrypoint-initdb.d/40-rehab-step4.sql:ro
      - ../../sql/mysql/rehab-step5-v1.sql:/docker-entrypoint-initdb.d/50-rehab-step5.sql:ro
      - ../../sql/mysql/rehab-step6-v1.sql:/docker-entrypoint-initdb.d/60-rehab-step6.sql:ro
      - ../../sql/mysql/rehab-step7-v1.sql:/docker-entrypoint-initdb.d/70-rehab-step7.sql:ro
      - ../../sql/mysql/rehab-step8-assessment-type-v2.sql:/docker-entrypoint-initdb.d/80-rehab-step8.sql:ro
      - ../../sql/mysql/rehab-crm-member-bootstrap-v1.sql:/docker-entrypoint-initdb.d/85-rehab-crm-member-bootstrap.sql:ro
      - ../../sql/mysql/rehab-crm-member-bridge-v1.sql:/docker-entrypoint-initdb.d/90-rehab-crm-member-bridge.sql:ro
      - ../../sql/mysql/rehab-step9-tenant-v1.sql:/docker-entrypoint-initdb.d/92-rehab-step9-tenant.sql:ro
      - ../../sql/mysql/rehab-disable-optional-module-menus-v1.sql:/docker-entrypoint-initdb.d/95-disable-optional-menus.sql:ro
      - ./disable-ai.sql:/docker-entrypoint-initdb.d/96-disable-ai.sql:ro
      - ./internal-hardening.sql:/docker-entrypoint-initdb.d/97-internal-hardening.sql:ro
      - ./clean-demo-rehab-data.sql:/docker-entrypoint-initdb.d/98-clean-demo-rehab-data.sql:ro
      - ../../sql/mysql/rehab-step10-integrity-v1.sql:/docker-entrypoint-initdb.d/99-rehab-integrity.sql:ro
      - ../../sql/mysql/rehab-step11-auth-hardening-v1.sql:/docker-entrypoint-initdb.d/100-auth-hardening.sql:ro
      - ../../sql/mysql/rehab-step12-internal-login-client-v1.sql:/docker-entrypoint-initdb.d/105-internal-login-client.sql:ro
      - ../../sql/mysql/rehab-step13-disable-undelivered-menus-v1.sql:/docker-entrypoint-initdb.d/108-disable-undelivered-menus.sql:ro
      - ./init-schema-history.sql:/docker-entrypoint-initdb.d/110-schema-history.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: deploy/internal/Dockerfile.server
    image: rehab-internal-server:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: internal
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ruoyi-vue-pro}
      DB_USERNAME: ${DB_USERNAME:-yudao}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      REHAB_STORAGE_PATH: /app/data/rehab
      OPENAI_ENABLE_AI_ANALYSIS: "false"
      SERVER_SERVLET_SESSION_PERSISTENT: "false"
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom -Dsun.io.useCanonCaches=false}
    volumes:
      - rehab-data:/app/data/rehab
      - server-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:48080/actuator/health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  admin:
    build:
      context: ../..
      dockerfile: deploy/internal/Dockerfile.admin
    image: rehab-internal-admin:latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${TLS_PORT:-8443}:443"
    volumes:
      - ./certs/ca.crt:/etc/nginx/tls/ca.crt:ro
      - ./certs/server.crt:/etc/nginx/tls/server.crt:ro
      - ./certs/server.key:/etc/nginx/tls/server.key:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --no-check-certificate
        - --spider
        - https://127.0.0.1/
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  rehab-data:
  server-logs:
