258: --- #################### 项目相关配置 ####################
259: 
260: yudao:
261:   info:
262:     version: 1.0.0
263:     base-package: cn.iocoder.yudao
264:   # Owner control plane -> main system handoff. Disabled unless a private-network token is injected.
265:   provisioning:
266:     enabled: ${YUDAO_PROVISIONING_ENABLED:false}
267:     token: ${YUDAO_PROVISIONING_TOKEN:}
268:   legacy:
269:     saas-platform:
270:       enabled: ${YUDAO_LEGACY_SAAS_PLATFORM_ENABLED:false}
271:   web:
272:     admin-ui:
273:       url: ${ADMIN_UI_URL:http://localhost:3000} # Admin 管理后台 UI 的地址
274:   xss:
275:     enable: false
276:     exclude-urls: # 如下两个 url，仅仅是为了演示，去掉配置也没关系
277:       - ${spring.boot.admin.context-path}/** # 不处理 Spring Boot Admin 的请求
278:       - ${management.endpoints.web.base-path}/** # 不处理 Actuator 的请求
279:   security:
280:     permit-all_urls:
281:       - /admin-api/mp/open/** # 微信公众号开放平台，微信回调接口，不需要登录
282:   api-encrypt:
283:     enable: ${YUDAO_API_ENCRYPT_ENABLE:false} # 默认关闭；启用时必须从运行环境注入密钥
284:     algorithm: AES # 加密算法，支持 AES、RSA 等
285:     request-key: ${YUDAO_API_ENCRYPT_REQUEST_KEY:}
286:     response-key: ${YUDAO_API_ENCRYPT_RESPONSE_KEY:}
287:   websocket:
288:     enable: true # websocket的开关
289:     path: /infra/ws # 路径
290:     sender-type: local # 消息发送的类型，可选值为 local、redis、rocketmq、kafka、rabbitmq
291:     sender-rocketmq:
292:       topic: ${spring.application.name}-websocket # 消息发送的 RocketMQ Topic
293:       consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 RocketMQ Consumer Group
294:     sender-rabbitmq:
295:       exchange: ${spring.application.name}-websocket-exchange # 消息发送的 RabbitMQ Exchange
296:       queue: ${spring.application.name}-websocket-queue # 消息发送的 RabbitMQ Queue
297:     sender-kafka:
298:       topic: ${spring.application.name}-websocket # 消息发送的 Kafka Topic
299:       consumer-group: ${spring.application.name}-websocket-consumer # 消息发送的 Kafka Consumer Group
300:   swagger:
301:     title: 运动康复评估与业务管理系统
302:     description: 康复管理系统 V1.0 管理后台与内部业务接口
303:     version: ${yudao.info.version}
304:     url: ${yudao.web.admin-ui.url}
305:     email: ${SOFTWARE_CONTACT_EMAIL:}
306:     license: MIT
307:     license-url: https://gitee.com/zhijiantianya/ruoyi-vue-pro/blob/master/LICENSE
308:   codegen:
309:     base-package: ${yudao.info.base-package}
310:     db-schemas: ${spring.datasource.dynamic.datasource.master.name}
311:     front-type: 20 # 前端模版的类型，参见 CodegenFrontTypeEnum 枚举类
312:     vo-type: 10 # VO 的类型，参见 CodegenVOTypeEnum 枚举类
313:     delete-batch-enable: true # 是否生成批量删除接口
314:     unit-test-enable: false # 是否生成单元测试
315:   tenant: # 多租户相关配置项
316:     enable: true
317:     ignore-visit-urls:
318:       - /admin-api/system/user/profile/**
319:       - /admin-api/system/auth/**
320:     ignore-tables:
321:     ignore-caches:
322:       - user_role_ids
323:       - permission_menu_ids
324:       - oauth_client
325:       - notify_template
326:       - mail_account
327:       - mail_template
328:       - sms_template
329:       - iot:device
330:       - iot:thing_model_list
331:   sms-code: # 短信验证码相关的配置项
332:     expire-times: 10m
333:     send-frequency: 1m
334:     send-maximum-quantity-per-day: 10
335:     begin-code: 9999 # 这里配置 9999 的原因是，测试方便。
336:     end-code: 9999 # 这里配置 9999 的原因是，测试方便。
337:   trade:
338:     order:
339:       pay-expire-time: 2h # 支付的过期时间
340:       receive-expire-time: 14d # 收货的过期时间
341:       comment-expire-time: 7d # 评论的过期时间
342:       status-sync-to-wxa-enable: true # 是否同步订单状态到微信小程序
