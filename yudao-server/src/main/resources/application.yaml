1: spring:
2:   application:
3:     name: yudao-server
4: 
5:   profiles:
6:     active: local
7: 
8:   main:
9:     allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。
10: 
11:   # Servlet 配置
12:   servlet:
13:     # 文件上传相关配置项
14:     multipart:
15:       max-file-size: 16MB # 单个文件大小
16:       max-request-size: 32MB # 设置总上传的文件大小
17: 
18:   # Jackson 配置项
19:   jackson:
20:     serialization:
21:       write-dates-as-timestamps: true # 设置 Date 的格式，使用时间戳
22:       write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
23:       write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
24:       fail-on-empty-beans: false # 允许序列化无属性的 Bean
25: 
26:   # Cache 配置项
27:   cache:
28:     type: REDIS
29:     redis:
30:       time-to-live: 1h # 设置过期时间为 1 小时
31: 
32: server:
33:   servlet:
34:     encoding:
35:       enabled: true
36:       charset: UTF-8 # 必须设置 UTF-8，避免 WebFlux 流式返回（AI 场景）会乱码问题
37:       force: true
38: 
39: --- #################### 接口文档配置 ####################
40: 
41: springdoc:
42:   api-docs:
43:     enabled: true
44:     path: /v3/api-docs
45:   swagger-ui:
46:     enabled: true
47:     path: /swagger-ui
48:   default-flat-param-object: true # 参见 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param 文档
49: 
50: knife4j:
51:   enable: true
52:   setting:
53:     language: zh_cn
54: 
55: # 工作流 Flowable 配置
56: flowable:
57:   # 1. false: 默认值，Flowable 启动时，对比数据库表中保存的版本，如果不匹配。将抛出异常
58:   # 2. true: 启动时会对数据库中所有表进行更新操作，如果表存在，不做处理，反之，自动创建表
59:   # 3. create_drop: 启动时自动创建表，关闭时自动删除表
60:   # 4. drop_create: 启动时，删除旧表，再创建新表
61:   database-schema-update: true # 设置为 false，可通过 https://github.com/flowable/flowable-sql 初始化
62:   db-history-used: true # flowable6 默认 true 生成信息表，无需手动设置
63:   check-process-definitions: false # 设置为 false，禁用 /resources/processes 自动部署 BPMN XML 流程
64:   history-level: audit # full：保存历史数据的最高级别，可保存全部流程相关细节，包括流程流转各节点参数
65: 
66: # MyBatis Plus 的配置项
67: mybatis-plus:
68:   configuration:
69:     map-underscore-to-camel-case: true # 虽然默认为 true ，但是还是显示去指定下。
70:   global-config:
71:     db-config:
72:       id-type: NONE # “智能”模式，基于 IdTypeEnvironmentPostProcessor + 数据源的类型，自动适配成 AUTO、INPUT 模式。
73: #      id-type: AUTO # 自增 ID，适合 MySQL 等直接自增的数据库
74: #      id-type: INPUT # 用户输入 ID，适合 Oracle、PostgreSQL、Kingbase、DB2、H2 数据库
75: #      id-type: ASSIGN_ID # 分配 ID，默认使用雪花算法。注意，Oracle、PostgreSQL、Kingbase、DB2、H2 数据库时，需要去除实体类上的 @KeySequence 注解
76:       logic-delete-value: 1 # 逻辑已删除值(默认为 1)
77:       logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
78:     banner: false # 关闭控制台的 Banner 打印
79:   type-aliases-package: ${yudao.info.base-package}.module.*.dal.dataobject
80:   encryptor:
81:     password: XDV71a+xqStEA3WH # 加解密的秘钥，可使用 https://www.imaegoo.com/2020/aes-key-generator/ 网站生成
82: 
83: mybatis-plus-join:
84:   banner: false # 是否打印 mybatis plus join banner，默认true
85:   sub-table-logic: true # 全局启用副表逻辑删除，默认true。关闭后关联查询不会加副表逻辑删除
86:   ms-cache: true # 拦截器MappedStatement缓存，默认 true
87:   table-alias: t # 表别名(默认 t)
88:   logic-del-type: on # 副表逻辑删除条件的位置，支持 WHERE、ON，默认 ON
89: 
90: # Spring Data Redis 配置
91: spring:
92:   data:
93:     redis:
94:       repositories:
95:         enabled: false # 项目未使用到 Spring Data Redis 的 Repository，所以直接禁用，保证启动速度
96: 
97: # VO 转换（数据翻译）相关
98: easy-trans:
99:   is-enable-global: false # 【默认禁用，对性能确认压力大】启用全局翻译（拦截所有 SpringMVC ResponseBody 进行自动翻译 )。如果对于性能要求很高可关闭此配置，或通过 @IgnoreTrans 忽略某个接口
100: 
101: --- #################### 验证码相关配置 ####################
102: 
103: aj:
104:   captcha:
105:     jigsaw: classpath:images/jigsaw # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
106:     pic-click: classpath:images/pic-click # 滑动验证，底图路径，不配置将使用默认图片；以 classpath: 开头，取 resource 目录下路径
107:     cache-type: redis # 缓存 local/redis...
108:     cache-number: 1000 # local 缓存的阈值,达到这个值，清除缓存
109:     timing-clear: 180 # local定时清除过期缓存(单位秒),设置为0代表不执行
110:     type: blockPuzzle # 验证码类型 default 三种都实例化。blockPuzzle 滑块拼图、clickWord 文字点选、pictureWord 文本输入
111:     water-mark: 康复管理系统 # 右下角水印文字，可使用 https://tool.chinaz.com/tools/unicode.aspx 中文转 Unicode，Linux 可能需要转 unicode
112:     interference-options: 0 # 滑动干扰项(0/1/2)
113:     req-frequency-limit-enable: false # 接口请求次数一分钟限制是否开启 true|false
114:     req-get-lock-limit: 5 # 验证失败 5 次，get接口锁定
115:     req-get-lock-seconds: 10 # 验证失败后，锁定时间间隔
116:     req-get-minute-limit: 30 # get 接口一分钟内请求数限制
117:     req-check-minute-limit: 60 # check 接口一分钟内请求数限制
118:     req-verify-minute-limit: 60 # verify 接口一分钟内请求数限制
119: 
120: --- #################### 消息队列相关 ####################
121: 
122: # rocketmq 配置项，对应 RocketMQProperties 配置类
123: rocketmq:
124:   # Producer 配置项
125:   producer:
126:     group: ${spring.application.name}_PRODUCER # 生产者分组
127: 
128: spring:
129:   # Kafka 配置项，对应 KafkaProperties 配置类
130:   kafka:
131:     # Kafka Producer 配置项
132:     producer:
133:       acks: 1 # 0-不应答。1-leader 应答。all-所有 leader 和 follower 应答。
134:       retries: 3 # 发送失败时，重试发送的次数
135:       value-serializer: org.springframework.kafka.support.serializer.JsonSerializer # 消息的 value 的序列化
136:     # Kafka Consumer 配置项
137:     consumer:
138:       auto-offset-reset: earliest # 设置消费者分组最初的消费进度为 earliest 。可参考博客 https://blog.csdn.net/lishuangzhe7047/article/details/74530417 理解
139:       value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
140:       properties:
141:         spring.json.trusted.packages: '*'
142:     # Kafka Consumer Listener 监听器配置
143:     listener:
144:       missing-topics-fatal: false # 消费监听接口监听的主题不存在时，默认会报错。所以通过设置为 false ，解决报错
145: 
